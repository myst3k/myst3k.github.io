<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myst3k</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
    opacity: 0.15;
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
  }

  .handle {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, #00ff88, #00bbff, #8855ff);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradient-shift 8s ease infinite;
    user-select: none;
  }

  .cursor {
    display: inline-block;
    width: 3px;
    height: 1em;
    background: #00ff88;
    margin-left: 4px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }

  .subtitle {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    font-weight: 300;
    color: #444;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0;
    animation: fade-in 2s ease 1.5s forwards;
  }

  .links {
    margin-top: 2.5rem;
    display: flex;
    gap: 2rem;
    justify-content: center;
    opacity: 0;
    animation: fade-in 2s ease 2.5s forwards;
  }

  .links a {
    color: #333;
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: color 0.3s ease;
  }

  .links a:hover {
    color: #00ff88;
  }

  .coord {
    position: fixed;
    bottom: 1.5rem;
    right: 2rem;
    font-size: 0.6rem;
    color: #1a1a2e;
    letter-spacing: 0.1em;
    z-index: 1;
  }

  @keyframes gradient-shift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="grid"></canvas>

<div class="container">
  <div class="handle" id="typed"></div>
  <div class="subtitle">building things in the dark</div>
  <div class="links">
    <a href="https://github.com/myst3k">github</a>
  </div>
</div>

<div class="coord" id="coord">25.7617° N, 80.1918° W</div>

<script>
// Typing effect
const text = 'myst3k';
const el = document.getElementById('typed');
let i = 0;

function type() {
  if (i <= text.length) {
    el.innerHTML = text.slice(0, i) + '<span class="cursor"></span>';
    i++;
    setTimeout(type, 120 + Math.random() * 80);
  }
}

setTimeout(type, 500);

// Grid background
const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener('resize', resize);

const dots = [];
const spacing = 30;

function initDots() {
  dots.length = 0;
  for (let x = 0; x < canvas.width; x += spacing) {
    for (let y = 0; y < canvas.height; y += spacing) {
      dots.push({ x, y, baseAlpha: Math.random() * 0.3 + 0.1 });
    }
  }
}

initDots();
window.addEventListener('resize', initDots);

let mouse = { x: -1000, y: -1000 };
document.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const dot of dots) {
    const dx = mouse.x - dot.x;
    const dy = mouse.y - dot.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const influence = Math.max(0, 1 - dist / 200);

    const r = 0;
    const g = Math.floor(255 * influence);
    const b = Math.floor(136 * influence);
    const alpha = dot.baseAlpha + influence * 0.7;

    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
    ctx.fillRect(dot.x - 1, dot.y - 1, 2, 2);
  }

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
